# This is the CI workflow for FreeCAD-CH, the Crawlspace Habitats fork.
# It runs on pushes to `integration`, on PRs into `integration` and by hand.
# FreeCAD's label-gated CI_approved.yml and its Linux build are not carried:
# the fork builds and tests on the two platforms it ships, Windows and
# macOS arm64, with the same pixi environment as the release builds.

name: FreeCAD CI primary

on:
  workflow_dispatch: ~
  push:
    branches:
      - integration
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - integration

permissions:
  contents: read

# A PR's new push cancels its running CI. Push runs on integration share one group too
# (ops#58), so a batch of merges ends with one finished push run and one ccache set, and
# the last run tests the combined state; each PR's own run has passed already. Runs
# started by hand are never cancelled.
concurrency:
  group: FC-CI-primary-${{ github.head_ref || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  Prepare:
    uses: ./.github/workflows/sub_prepare.yml
    with:
      artifactBasename: Prepare-${{ github.run_id }}

  # Skipped for a changeset of Markdown files only. A skipped job counts as passed for
  # required checks, so this keeps working if integration gets them.
  Pixi:
    needs: [Prepare]
    if: needs.Prepare.outputs.docsOnly != 'true'
    uses: ./.github/workflows/sub_buildPixi.yml
    with:
      artifactBasename: Pixi-${{ github.run_id }}

  Lint:
    needs: [Prepare]
    uses: ./.github/workflows/sub_lint.yml
    with:
      artifactBasename: Lint-${{ github.run_id }}
      changedFiles: ${{ needs.Prepare.outputs.changedFiles }}
      changedCppFiles: ${{ needs.Prepare.outputs.changedCppFiles }}
      changedCppLines: ${{ needs.Prepare.outputs.changedCppLines }}
      changedPythonFiles: ${{ needs.Prepare.outputs.changedPythonFiles }}

  WrapUp:
    needs: [
        Prepare,
        Pixi,
        Lint
      ]
    if: always()
    uses: ./.github/workflows/sub_wrapup.yml
    with:
      previousSteps: ${{ toJSON(needs) }}
