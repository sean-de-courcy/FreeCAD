# This is a build and test workflow for CI of FreeCAD.
# This workflow aims at building and testing FreeCAD on a Conda environment on macOS.

name: Pixi Builds

on:
  workflow_call:
    inputs:
      artifactBasename:
        type: string
        required: true
      # The runner images to build on, as a JSON list: CI_primary.yml passes Windows,
      # CI_macos.yml macOS (ops#533).
      platforms:
        type: string
        required: true
      testOnBuildDir:
        default: false
        type: boolean
        required: false
      testCoinNodeSnapshots:
        default: true
        type: boolean
        required: false
      skipBuild:
        default: false
        type: boolean
        required: false
      allowedToFail:
        default: false
        type: boolean
        required: false
      # The compat generation the macOS job saves (ops#538): 0 is gen0-macos from gen0's models,
      # k above 0 gen<k>-macos from every model (CI_macos.yml's dispatch input).
      compatGeneration:
        default: "0"
        type: string
        required: false
    outputs:
      reportFile:
        value: ${{ jobs.Build.outputs.reportFile }}

permissions:
  contents: read

jobs:
  build_with_pixi:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ inputs.allowedToFail }}
    env:
      CCACHE_COMPRESS: true
      CCACHE_COMPRESSLEVEL: 5
      CCACHE_CONFIGPATH: ${{ github.workspace }}/ccache/config
      CCACHE_DIR: ${{ github.workspace }}/ccache
      # Both platforms' objects outgrew 1 GB, and ccache then evicts them mid-build (ops#37, ops#48).
      # Windows then filled 1.5 GB and evicted again (ops#51).
      CCACHE_MAXSIZE: ${{ startsWith(matrix.os, 'windows') && '2000M' || '1500M' }}
      CCACHE_NOHASHDIR: true
      CCACHE_NOINODECACHE: true
      CCACHE_SLOPPINESS: "include_file_ctime,include_file_mtime,pch_defines,time_macros"
      builddir: ${{ github.workspace }}/build/release/
      cacheKey: pixi-${{ matrix.os }}
      config: release
      logdir: ${{ github.workspace }}/logs/
      reportdir: ${{ github.workspace }}/report/
      reportfilename: ${{ inputs.artifactBasename }}-${{ matrix.os }}-report.md
      shellCmd: "pixi run bash -l {0}"
    outputs:
      reportFile: ${{ steps.Init.outputs.reportFile }}

    strategy:
      max-parallel: 6
      fail-fast: false
      matrix:
        # FreeCAD-CH ships Windows x64 (windows-2022) and macOS arm64 (macos-26) only. The macOS
        # image is pinned (macos-latest was macos-26 in September 2026); build_release.yml uses the
        # same one.
        os: ${{ fromJSON(inputs.platforms) }}

    steps:
    - name: Harden the runner (Audit all outbound calls)
      if: "!inputs.skipBuild"
      uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
      with:
        egress-policy: audit

    - name: Set Platform Environment Variables
      if: "!inputs.skipBuild"
      shell: bash -l {0}
      env:
        OPERATING_SYSTEM: ${{ runner.os }}
      run: |
        if [[ $OPERATING_SYSTEM == 'Windows' ]]; then
          echo 'CCACHE_COMPILERCHECK=%compiler%' >> "$GITHUB_ENV"
          # github.workspace has backslashes on Windows, which bash drops from unquoted
          # paths. wsdir is the workspace with forward slashes, for steps run in bash.
          echo "wsdir=$(cygpath -m "$GITHUB_WORKSPACE")" >> "$GITHUB_ENV"
        else
          echo 'CCACHE_COMPILERCHECK=%compiler% -dumpfullversion -dumpversion' >> "$GITHUB_ENV"
          echo "wsdir=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        fi

    - name: Checkout
      if: "!inputs.skipBuild"
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Add GCC Problem Matcher
      if: runner.os == 'Linux' && !inputs.skipBuild
      run: |
        echo "::add-matcher::${{ runner.workspace }}/FreeCAD/.github/problemMatcher/gcc.json"

    - name: Add Clang Problem Matcher
      if: runner.os == 'macOS' && !inputs.skipBuild
      run: |
        echo "::add-matcher::${{ runner.workspace }}/FreeCAD/.github/problemMatcher/clang.json"

    - name: Add MSVC++ Problem Matcher
      if: runner.os == 'Windows' && !inputs.skipBuild
      run: |
        echo "::add-matcher::${{ runner.workspace }}/FreeCAD/.github/problemMatcher/msvc.json"

    - name: Make needed directories, files and initializations
      if: "!inputs.skipBuild"
      id: Init
      run: |
        mkdir -p ${{ env.builddir }}
        mkdir -p ${{ env.logdir }}
        mkdir -p ${{ env.reportdir }}
        echo "reportFile=${{ env.reportfilename }}" >> $GITHUB_OUTPUT

    # Windows restores its pixi environment from the Actions cache (2 GB, keyed to
    # pixi.lock): 1 min instead of 3.5-4 min, sometimes 10 min (ops#31). Only
    # integration writes it, once per pixi.lock. macOS installs in about 1 min.
    - if: "!inputs.skipBuild"
      uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
      with:
        pixi-version: v0.81.0
        cache: ${{ runner.os == 'Windows' }}
        cache-write: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/integration' }}
        locked: true

    # Identifiers named like <windows.h> macros (near, far, ...) pass this build but fail the
    # Windows release build (ops#294), so they fail here, before the build.
    - name: Check for identifiers named like windows.h macros
      if: "!inputs.skipBuild"
      shell: bash
      run: pixi run python .github/scripts/check_windows_macros.py src

    - name: Restore Compiler Cache
      id: cache-restore
      if: "!inputs.skipBuild"
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}
        restore-keys: |
          FC-${{ env.cacheKey }}-${{ github.ref }}-
          FC-${{ env.cacheKey }}-

    - name: Print CCache statistics before build, reset stats and print config
      if: "!inputs.skipBuild"
      run: |
        pixi run ccache -s
        pixi run ccache -z
        pixi run ccache -p

    - name: CMake Configure
      if: "!inputs.skipBuild"
      run: |
        pixi run configure-${{ env.config }}

    - name: CMake Build
      id: build
      if: "!inputs.skipBuild"
      run: |
        pixi run build-${{ env.config }}

    - name: Print ccache statistics after Build
      if: "!inputs.skipBuild"
      run: |
        pixi run ccache -s

    # The test steps below run whenever the build succeeded, even after an earlier test step
    # failed, and compare their failures with the known-failure list (tests/known-failures,
    # .github/scripts/known_failures.py): a step fails only on an unlisted failure.

    # On Windows the CLI tests run on the build dir (the install tests are skipped there);
    # FreeCAD's LibPack Windows build, which ran them upstream, isn't carried.
    - name: FreeCAD CLI tests on build dir
      if: (inputs.testOnBuildDir || runner.os == 'Windows') && !cancelled() && steps.build.outcome == 'success'
      timeout-minutes: 30
      uses: ./.github/workflows/actions/runPythonTests
      with:
        testDescription: "CLI tests on build dir"
        testCommand: ${{ env.wsdir }}/build/release/bin/FreeCADCmd -t 0
        logFile: ${{ env.wsdir }}/logs/TestCLIBuild.log
        reportFile: ${{ env.wsdir }}/report/${{ env.reportfilename }}
        shellCmd: ${{ env.shellCmd }}
        knownFailuresPlatform: ${{ runner.os }}

    - name: FreeCAD GUI tests on build dir
      if: runner.os == 'Linux' && inputs.testOnBuildDir && !inputs.skipBuild
      timeout-minutes: 15
      uses: ./.github/workflows/actions/runPythonTests
      with:
        testDescription: "GUI tests on build dir"
        testCommand: xvfb-run ${{ env.builddir }}/bin/FreeCAD -t 0
        logFile: ${{ env.logdir }}TestGUIBuild.log
        reportFile: ${{env.reportdir}}${{ env.reportfilename }}
        shellCmd: ${{ env.shellCmd }}

    - name: Coin node snapshot visual tests on build dir
      if: runner.os == 'Linux' && inputs.testCoinNodeSnapshots && !inputs.skipBuild
      timeout-minutes: 15
      uses: ./.github/workflows/actions/runPythonTests
      with:
        testDescription: "Coin node snapshot visual tests on build dir"
        testCommand: |
          FC_VISUAL_OUT_DIR="/tmp/FreeCADTesting/CoinNodeSnapshots" \
          xvfb-run -a -s "-screen 0 1024x768x24" \
            "${{ env.builddir }}/bin/FreeCAD" -t TestCoinNodeSnapshots
        logFile: ${{ env.logdir }}TestCoinNodeSnapshotsBuild.log
        reportFile: ${{env.reportdir}}${{ env.reportfilename }}
        shellCmd: ${{ env.shellCmd }}

    - name: Upload Coin node snapshot artifacts (on failure)
      if: failure() && runner.os == 'Linux' && inputs.testCoinNodeSnapshots && !inputs.skipBuild
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifactBasename }}-${{ matrix.os }}-CoinNodeSnapshots
        path: /tmp/FreeCADTesting/CoinNodeSnapshots

    - name: src/Tools tests
      if: "!cancelled() && steps.build.outcome == 'success'"
      run: pixi run python -m unittest discover -s src/Tools/tests -p "test_*.py"

    # Windows too (upstream skips it there); the runner puts the module DLLs on PATH itself.
    - name: C++ tests
      timeout-minutes: 20
      if: "!cancelled() && steps.build.outcome == 'success'"
      uses: ./.github/workflows/actions/runCPPTests/runAllTests
      with:
        reportdir: ${{ env.wsdir }}/logs/
        builddir: ${{ env.wsdir }}/build/release
        reportFile: ${{ env.wsdir }}/report/${{ env.reportfilename }}
        platform: ${{ runner.os }}
        shellCmd: ${{ env.shellCmd }}

    - name: CMake Install
      if: "!cancelled() && steps.build.outcome == 'success'"
      run: |
        pixi run install-${{ env.config }}

    # macOS only. Green runs took 6.4-9.9 min on 2026-10-12, and 10 min timed out (ops#302). On 2026-10-27 the
    # same tests took 946-1213 s (runner variance), and 20 min timed out.
    - name: FreeCAD CLI tests on install
      if: runner.os != 'Windows' && !cancelled() && steps.build.outcome == 'success'
      timeout-minutes: 35
      uses: ./.github/workflows/actions/runPythonTests
      with:
        testDescription: "CLI tests on install"
        testCommand: FreeCADCmd -t 0
        logFile: ${{ env.logdir }}TestCLIInstall.log
        reportFile: ${{env.reportdir}}${{ env.reportfilename }}
        shellCmd: ${{ env.shellCmd }}
        knownFailuresPlatform: ${{ runner.os }}

    # The naming corpus's gate (ops#506, src/Mod/PartDesign/PartDesignTests/Scenarios/README.md):
    # tier G's cases against their ledgers, on every PR. Windows judges (a REGRESSED, NEW or STALE
    # key fails it); macOS is advisory for the first naming cycle and leaves its would-be ledgers
    # in the logs artifact (corpus-ledger/). IMPROVED and CHANGED are warnings that the merge
    # guard (the ops repo's scripts/corpus_guard.sh) refuses. Target under 5 minutes.
    - name: Naming corpus gate
      if: "!cancelled() && steps.build.outcome == 'success'"
      timeout-minutes: 10
      continue-on-error: ${{ runner.os == 'macOS' }}
      shell: pixi run bash -l {0}
      env:
        FREECAD_SCENARIO_TIER: G
        FREECAD_SCENARIO_LEDGER_OUT: ${{ env.wsdir }}/logs/corpus-ledger
        OPERATING_SYSTEM: ${{ runner.os }}
      # wsdir is expanded by Actions, as in the other test steps: bash under pixi run on
      # Windows doesn't see the lower-case variable (the first run ran /build/release/bin/...).
      run: |
        set -o pipefail
        mkdir -p "${{ env.wsdir }}/logs"
        # Windows: the build dir (its CLI tests run there); macOS: the install
        if [[ $OPERATING_SYSTEM == 'Windows' ]]; then exe="${{ env.wsdir }}/build/release/bin/FreeCADCmd"; else exe=FreeCADCmd; fi
        "$exe" -t PartDesignTests.TestCorpusGate 2>&1 | tee "${{ env.wsdir }}/logs/TestCorpusGate.log"
        # A run that ends early (a case module exiting at import) exits 0 without its summary
        if ! grep -q '^CORPUS tier G:' "${{ env.wsdir }}/logs/TestCorpusGate.log"; then
          echo "::error title=Naming corpus gate::the run ended without its CORPUS summary line"
          exit 1
        fi

    # The macOS half of the compat corpus (ops#538, PLAN decision 181: files are shared between
    # Windows and macOS, so each generation has a half saved on each). With no Mac at hand, every
    # macOS run saves the half from its install and uploads it as compat-gen<k>-macos; regen_gen0.sh
    # --from installs the download (the ops repo's notes/beta-compatibility.md 3.9). gen0's half
    # takes gen0/MANIFEST's models and is compared with the committed one, for the log only; a
    # dispatch with compat_generation=<k> saves gen<k>-macos from every model (the beta's gen1).
    # Advisory: the gate (TestCompatCorpus) judges the corpus, this only makes the next half.
    - name: Compat generation (macOS half)
      id: compatgen
      if: runner.os == 'macOS' && !cancelled() && steps.build.outcome == 'success'
      timeout-minutes: 15
      continue-on-error: true
      shell: pixi run bash -l {0}
      env:
        COMPAT_GENERATION: ${{ inputs.compatGeneration }}
      run: |
        set -o pipefail
        C="${{ env.wsdir }}/src/Mod/PartDesign/PartDesignTests/Compat"
        out="${{ env.wsdir }}/compat-generation"
        mkdir -p "$out" "${{ env.wsdir }}/logs"
        if [[ "$COMPAT_GENERATION" == 0 ]]; then
          bash "$C/regen_gen0.sh" --checkout "${{ env.wsdir }}" --build "$CONDA_PREFIX" --env "$CONDA_PREFIX" \
            --out "$out" 2>&1 | tee "${{ env.wsdir }}/logs/compat-generation.log" || rc=$?
        else
          [[ "$COMPAT_GENERATION" =~ ^[1-9][0-9]*$ ]] || { echo "::error::compat_generation '$COMPAT_GENERATION' is not a number"; exit 2; }
          home=$(mktemp -d)
          FREECAD_USER_HOME="$home" QT_QPA_PLATFORM=offscreen FREECAD_COMPAT_OUT="$out/gen${COMPAT_GENERATION}-macos" \
            FREECAD_COMPAT_RESULT="$out/result.txt" FreeCADCmd "$C/regen_gen0_drive.py" 2>&1 |
            tee "${{ env.wsdir }}/logs/compat-generation.log" || rc=$?
          [[ "$(head -n 1 "$out/result.txt" 2> /dev/null)" == OK ]] || { cat "$out/result.txt" 2> /dev/null; rc=3; }
        fi
        if [[ "${rc:-0}" != 0 ]]; then
          echo "::warning title=Compat generation (macOS half)::gen${COMPAT_GENERATION}-macos was not saved (exit $rc): logs/compat-generation.log"
          exit 1
        fi

    - name: Upload the compat generation (macOS half)
      if: runner.os == 'macOS' && !cancelled() && steps.compatgen.outcome == 'success'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: compat-gen${{ inputs.compatGeneration }}-macos
        path: ${{ env.wsdir }}/compat-generation/gen${{ inputs.compatGeneration }}-macos/
        if-no-files-found: error
        retention-days: 14
        overwrite: true

    - name: FreeCAD GUI tests on install
      # if: runner.os == 'Linux' && !inputs.skipBuild
      # currently broken on Qt6 builds
      if: false
      timeout-minutes: 15
      uses: ./.github/workflows/actions/runPythonTests
      with:
        testDescription: "GUI tests on install"
        testCommand: xvfb-run FreeCAD -t 0
        logFile: ${{ env.logdir }}TestGUIInstall.log
        reportFile: ${{env.reportdir}}${{ env.reportfilename }}
        shellCmd: ${{ env.shellCmd }}

    # Only runs on integration (pushes, or by hand) save the cache: PR runs restore
    # integration's newest entry through the FC-<cacheKey>- prefix, and entries saved
    # for a PR ref are useless once it merges (the repository's Actions cache holds
    # 10 GB). CI_cleanup.yml then deletes integration's superseded entries (ops#57).
    # Save whenever the build succeeded, even if tests failed afterwards; otherwise a
    # run with a failing test leaves the next run a cold build (2-3 h).
    - name: Save Compiler Cache
      id: cache-save
      if: "!cancelled() && steps.build.outcome == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/integration'"
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ env.CCACHE_DIR }}
        key: FC-${{ env.cacheKey }}-${{ github.ref }}-${{ github.run_id }}

    - name: Upload logs
      if: "!cancelled() && !inputs.skipBuild"
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifactBasename }}-${{ matrix.os }}-Logs
        path: |
          ${{ env.logdir }}
          /var/crash/*FreeCAD*

    - name: Upload report
      if: "!cancelled() && !inputs.skipBuild"
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.reportfilename }}
        path: |
          ${{env.reportdir}}${{ env.reportfilename }}
