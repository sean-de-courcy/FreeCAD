# FreeCAD-CH: every gtest and QtTest executable in the build runs, even after a failure, and
# the result is compared with the known-failure list (tests/known-failures). The step fails only
# on a failure that isn't listed, or a suite that crashed or timed out (.github/scripts/known_failures.py).

name: Run all C++ Tests
description: "Run all C++ test executables and compare their failures with the known-failure list"

inputs:
  reportdir:
    description: "Report directory where logs will be stored"
    required: true
  builddir:
    description: "Build directory where tests are located"
    required: true
  reportFile:
    description: "Path for report file"
    required: true
  platform:
    description: "Platform whose known-failure entries apply (runner.os works: Windows, macOS)"
    required: true
  shellCmd:
    description: "Shell command to use for action steps (e.g. 'pixi run bash -l {0}')"
    default: "bash -l {0}"
    required: false

runs:
  using: "composite"
  steps:
      - name: Run the C++ tests and check them against the known-failure list
        shell: ${{ inputs.shellCmd }}
        env:
          BUILD_DIR: ${{ inputs.builddir }}
          REPORT_DIR: ${{ inputs.reportdir }}
          REPORT_FILE: ${{ inputs.reportFile }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          python .github/scripts/known_failures.py gtest --platform "$PLATFORM"             --build-dir "$BUILD_DIR" --out-dir "$REPORT_DIR/gtest" --report "$REPORT_FILE"
